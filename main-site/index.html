<!doctype html>
<html lang="bn" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1"
    />
    <meta name="theme-color" content="#1B4332" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="BSDC" />
    <meta name="apple-mobile-web-app-title" content="BSDC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>
      Bangladesh Software Development Community (BSDC) — The Pride of Bangladesh | Developer
      Community, Blogs, Jobs, Marketplace
    </title>
    <meta
      name="description"
      content="BSDC is the open community platform for Bangladeshi and worldwide software developers: a social feed, developer blogs, questions, jobs, freelancing, a marketplace and a verification system. Free and bilingual."

    <link rel="canonical" href="https://www.bsdc.info.bd/" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!--
      Defaults for the social preview. The edge middleware rewrites these in
      place for a page whose content lives in the database, and React writes
      them again on hydration, so all three agree.
    -->
    <meta property="og:site_name" content="Bangladesh Software Development Community" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BSDC — the open developer community of Bangladesh" />

      property="og:description"
      content="Posts, groups, events, jobs, freelance work, open-source projects, courses and a marketplace, built by and for Bangladeshi software developers."
    />
    <meta property="og:url" content="https://www.bsdc.info.bd/" />
    <meta property="og:image" content="https://www.bsdc.info.bd/og/og-image.png" />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BSDC — the open developer community of Bangladesh" />
    <meta
      name="twitter:description"
      content="The open community platform for Bangladeshi and worldwide software developers."
    />
    <meta name="twitter:image" content="https://www.bsdc.info.bd/og/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="BSDC — Blog"
      href="https://www.bsdc.info.bd/rss.xml"
    />
    <link
      rel="alternate"
      type="application/rss+xml"

    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: Inter, Arial, sans-serif">
        <p><strong>Bangladesh Software Development Community</strong></p>

          BSDC needs JavaScript to run the interactive application. The full content of every public

        <p lang="bn">

          ইঞ্জিনের জন্য প্রি-রেন্ডার করা এইচটিএমএল আকারেও পাওয়া যায়।
        </p>
      </div>

    <script type="module" src="/src/main.tsx"></script>
