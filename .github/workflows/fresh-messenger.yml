name: Fresh Messenger

# Clears all platform-wide messenger data across every user (conversations,
# memberships, unsent drafts, pin/archive/mute settings, messages, reply chains,
# reactions, receipts, pins, stars, send idempotency records, messenger reports,
# and RTDB /typing indicators) along with all messenger notifications (and their
# cascading per-device push/FCM deliveries), leaving profiles, posts, comments,
# follows, courses, jobs, and non-messenger notifications untouched.
#
# Safety & idempotency:
#   - On initial push (`--once=2026-11-13-initial-fresh-reset`), `audit_log` is
#     checked inside the same PostgreSQL transaction so future pushes or merges
#     are automatic no-ops and never delete subsequent chats.
#   - Manual `workflow_dispatch` supports read-only `dry-run` by default, and
#     requires typing `FRESH_MESSENGER` for `reset`.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Dry-run inspects counts only; reset permanently clears all messenger data & messenger notifications'
        type: choice
        options:
          - dry-run
          - reset
        default: dry-run
        required: true
      confirmation:
        description: 'Type FRESH_MESSENGER to authorize a destructive reset (ignored for dry-run)'
        type: string
        default: ''
        required: false
  push:
    branches: ['**']
    paths:
      - '.github/workflows/fresh-messenger.yml'
      - 'scripts/fresh-messenger.mjs'
  pull_request:
    paths:
      - '.github/workflows/fresh-messenger.yml'
      - 'scripts/fresh-messenger.mjs'

permissions:
  contents: read

concurrency:
  group: fresh-messenger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify fresh-messenger against Postgres 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Postgres client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client && break
              echo "apt-get install failed (attempt $attempt); retrying..." >&2
              sleep 5
              sudo apt-get update --fix-missing || true
            done
          fi
          command -v psql >/dev/null 2>&1
          psql --version

      - name: Run unit self-tests
        run: node scripts/fresh-messenger.mjs --self-test

      - name: Build schema from migrations
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end
          $$;
          grant usage on schema public to anon, authenticated, service_role;
          SQL
          node scripts/db-push.mjs > /dev/null

      - name: Prove dry-run, blocked reply-chain cleanup, --once idempotency, and confirmation guard on Postgres 16
        shell: bash
        run: |
          set -euo pipefail

          # Seed users, non-messenger social/post data, 3-deep reply chain + post-chat block,
          # legacy pre-0048 message notification, and messenger + post reports.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.profiles (uid, username, display_name, role, status) values
            ('u-alice', 'alice_ci', 'Alice', 'member', 'active'),
            ('u-bob',   'bob_ci',   'Bob',   'member', 'active');

          insert into public.follows (follower_uid, followee_uid) values ('u-alice', 'u-bob');
          insert into public.posts (id, slug, author_uid, title, body, status, visibility, published_at) values
            ('99999999-9999-4999-8999-999999999991', 'ci-keep-post', 'u-alice', 'Keep', 'Body', 'published', 'public', now());

          do $$
          declare
            v_conv uuid;
            v_m1 uuid;
            v_m2 uuid;
            v_m3 uuid;
          begin
            perform set_config('request.jwt.claims', '{"sub":"u-alice","role":"authenticated","bsdc_role":"member","staff":false}', true);
            set local role authenticated;
            select public.open_direct_conversation('u-bob') into v_conv;
            select id into v_m1 from public.send_message_once(v_conv, '11111111-1111-4111-8111-000000000001'::uuid, 'Msg 1', 'text', '', '', '', null);
            perform set_config('request.jwt.claims', '{"sub":"u-bob","role":"authenticated","bsdc_role":"member","staff":false}', true);
            select id into v_m2 from public.send_message_once(v_conv, '11111111-1111-4111-8111-000000000002'::uuid, 'Reply 2', 'text', '', '', '', v_m1);
            perform set_config('request.jwt.claims', '{"sub":"u-alice","role":"authenticated","bsdc_role":"member","staff":false}', true);
            select id into v_m3 from public.send_message_once(v_conv, '11111111-1111-4111-8111-000000000003'::uuid, 'Deep reply 3', 'text', '', '', '', v_m2);
            reset role;

            insert into public.blocks (blocker_uid, blocked_uid, reason) values ('u-bob', 'u-alice', 'ci block check');
            insert into public.notifications (uid, actor_uid, kind, post_id, comment_id, body)
              values ('u-bob', 'u-alice', 'comment', null, v_m1, 'Legacy chat notification');
            insert into public.reports (reporter_uid, subject_type, subject_id, reason) values
              ('u-bob', 'message', v_m1, 'spam'),
              ('u-bob', 'post', '99999999-9999-4999-8999-999999999991', 'other');
          end
          $$;
          SQL

          if node scripts/fresh-messenger.mjs --apply --confirm=wrong >/dev/null 2>&1; then
            echo '::error::Expected --apply without exact confirmation phrase to fail.'
            exit 1
          fi

          node scripts/fresh-messenger.mjs --dry-run | tee /tmp/fm-dry.md
          grep -q '`dry_run`' /tmp/fm-dry.md
          test "$(psql "$SUPABASE_DB_URL" -t -A -c 'select count(*) from public.messages')" = '3'

          node scripts/fresh-messenger.mjs --apply --once=ci-verify-reset | tee /tmp/fm-apply.md
          grep -q '`applied`' /tmp/fm-apply.md
          test "$(psql "$SUPABASE_DB_URL" -t -A -c 'select count(*) from public.conversations')" = '0'
          test "$(psql "$SUPABASE_DB_URL" -t -A -c 'select count(*) from public.messages')" = '0'
          test "$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from public.notifications where kind = 'message' or conversation_id is not null or (kind = 'comment' and post_id is null)")" = '0'
          test "$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from public.notifications where kind = 'follow'")" = '1'
          test "$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from public.reports where subject_type = 'post'")" = '1'

          node scripts/fresh-messenger.mjs --apply --once=ci-verify-reset | tee /tmp/fm-replay.md
          grep -q '`already_applied`' /tmp/fm-replay.md

          node scripts/fresh-messenger.mjs --apply --confirm=FRESH_MESSENGER | tee /tmp/fm-manual.md
          grep -q '`applied`' /tmp/fm-manual.md

  execute:
    name: Freshen production messenger
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: fresh-messenger-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.bsdc.info.bd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Postgres client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client && break
              echo "apt-get install failed (attempt $attempt); retrying..." >&2
              sleep 5
              sudo apt-get update --fix-missing || true
            done
          fi
          command -v psql >/dev/null 2>&1
          psql --version

      - name: Check production database reachability
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/db-reachable.mjs

      - name: Execute fresh messenger workflow
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT_BSDC_BD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
          VITE_FB_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACTION: ${{ github.event.inputs.action || 'dry-run' }}
          DISPATCH_CONFIRM: ${{ github.event.inputs.confirmation || '' }}
          INITIAL_ONCE_STAMP: '2026-11-13-initial-fresh-reset'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ "$DISPATCH_ACTION" = 'dry-run' ]; then
              node scripts/fresh-messenger.mjs --dry-run --summary="$GITHUB_STEP_SUMMARY"
            elif [ "$DISPATCH_ACTION" = 'reset' ]; then
              if [ "$DISPATCH_CONFIRM" != 'FRESH_MESSENGER' ]; then
                echo '::error::Confirmation input must equal FRESH_MESSENGER to reset production messenger.'
                exit 1
              fi
              node scripts/fresh-messenger.mjs --apply --confirm="$DISPATCH_CONFIRM" --summary="$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Unsupported action: $DISPATCH_ACTION"
              exit 1
            fi
          else
            node scripts/fresh-messenger.mjs --apply --once="$INITIAL_ONCE_STAMP" --summary="$GITHUB_STEP_SUMMARY"
          fi
