name: Deploy Firebase policy and backend

# Synchronize only production backend sources from the protected Arena delivery branch. This
# repairs a missing trusted function without asking a mobile client to bypass server-side access
# controls. Manual dispatch remains available for an intentional policy-only deployment.
on:
  push:
    branches: [arena/01a0ed9c-bsdc]
    paths:
      - ".github/workflows/firebase-deploy.yml"
      - "firebase.json"
      - "firebase/**"
      - "functions/**"
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy trusted Functions as well as database policy
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub does not permit the secrets context in a job-level `if`. Validate the protected
    # credential in a step instead, then gate all credential-dependent work on its output.
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected deployment credential
        id: credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_BSDC_BD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BSDC_BD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firebase deploy skipped::Add FIREBASE_SERVICE_ACCOUNT_BSDC_BD as a protected Actions secret, then rerun this manual workflow."
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          credential = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_BSDC_BD"])
          assert credential.get("type") == "service_account", "Credential must be a service-account JSON object"
          assert credential.get("project_id") == "bsdc-bd", "Credential project_id must be bsdc-bd"
          assert credential.get("client_email"), "Credential client_email is missing"
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: ${{ steps.credential.outputs.configured == 'true' }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Build trusted Functions
        if: ${{ steps.credential.outputs.configured == 'true' }}
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy Firestore, Realtime Database, and Functions
        # A qualified backend-source push always deploys Functions. For a manual run, the input
        # retains an explicit policy-only option.
        if: ${{ steps.credential.outputs.configured == 'true' && (github.event_name == 'push' || inputs.deploy_functions) }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_BSDC_BD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
        run: |
          set -euo pipefail
          credential="$RUNNER_TEMP/bsdc-firebase-deploy.json"
          log="$RUNNER_TEMP/bsdc-firebase-deploy.log"
          trap 'rm -f "$credential"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BSDC_BD" > "$credential"
          chmod 600 "$credential"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential"
          if ! npx --yes firebase-tools@13.35.1 deploy --non-interactive \
            --only firestore:rules,firestore:indexes,database,functions --project bsdc-bd 2>&1 | tee "$log"; then
            # Keep a concise, credential-free deployment diagnosis in the Checks API as well as
            # the job log. This remains visible when external Actions log storage is unavailable.
            summary="$(tail -n 60 "$log" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-6000)"
            echo "::error title=Firebase deployment failed::$summary"
            {
              echo "## Firebase deployment failure"
              echo
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Deploy Firestore and Realtime Database policy only
        if: ${{ steps.credential.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && !inputs.deploy_functions }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_BSDC_BD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
        run: |
          set -euo pipefail
          credential="$RUNNER_TEMP/bsdc-firebase-deploy.json"
          log="$RUNNER_TEMP/bsdc-firebase-deploy.log"
          trap 'rm -f "$credential"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BSDC_BD" > "$credential"
          chmod 600 "$credential"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential"
          if ! npx --yes firebase-tools@13.35.1 deploy --non-interactive \
            --only firestore:rules,firestore:indexes,database --project bsdc-bd 2>&1 | tee "$log"; then
            summary="$(tail -n 60 "$log" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-6000)"
            echo "::error title=Firebase policy deployment failed::$summary"
            {
              echo "## Firebase policy deployment failure"
              echo
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
