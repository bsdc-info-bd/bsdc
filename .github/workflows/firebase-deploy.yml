name: Deploy Firebase policy and backend

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy trusted Functions as well as database policy
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected service-account secret is required; no Firebase credential is stored in Git.
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Build trusted Functions
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy Firestore, Realtime Database, and Functions
        uses: w9jds/firebase-action@v13.28.0
        with:
          args: deploy --only firestore:rules,firestore:indexes,database${{ inputs.deploy_functions && ',functions' || '' }} --project bsdc-bd
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
