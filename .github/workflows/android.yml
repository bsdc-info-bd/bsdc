name: BSDC Android APK and AAB

on:
  push:
    branches: [arena/01a0ed9c-bsdc]
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build a signed release APK and AAB when release signing secrets are configured
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: bsdc-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build verified BSDC Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare pinned Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      # A workflow with no configuration still runs source checks, but deliberately never uploads
      # an APK that would only show the app's configuration-required screen.
      - name: Materialize and validate protected runtime configuration
        id: runtime_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          declare -A required=(
            [GOOGLE_SERVICES_JSON]="$GOOGLE_SERVICES_JSON"
            [CLOUDINARY_CLOUD_NAME]="$CLOUDINARY_CLOUD_NAME"
            [CLOUDINARY_UPLOAD_PRESET]="$CLOUDINARY_UPLOAD_PRESET"
          )
          missing=()
          for name in "${!required[@]}"; do [ -z "${required[$name]}" ] && missing+=("$name"); done
          if [ "${#missing[@]}" -eq 3 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No protected runtime configuration is available; source validation will continue without an APK artifact."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing BSDC runtime secrets::Add these Actions secrets: ${missing[*]}"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          if ! GOOGLE_CLIENT_FROM_FIREBASE="$(python3 - <<'PY'
          import json
          config = json.load(open("app/google-services.json", encoding="utf-8"))
          expected = "bd.info.bsdc.app"
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in config.get("client", [])]
          assert expected in packages, f"google-services.json does not contain {expected}"
          assert config.get("project_info", {}).get("project_id"), "Firebase project ID is missing"
          web_clients = [entry.get("client_id", "") for client in config.get("client", []) for entry in client.get("oauth_client", []) if entry.get("client_type") == 3]
          assert web_clients and web_clients[0].endswith(".apps.googleusercontent.com"), "Web OAuth client is missing"
          print(web_clients[0])
          PY
          )"
          then
            echo "::error title=Invalid GOOGLE_SERVICES_JSON::Use the raw Firebase Console Android JSON for package bd.info.bsdc.app, without Markdown fences or base64 encoding."
            exit 1
          fi
          # The Firebase JSON is the source of truth. An optional Actions secret can override it
          # for an intentionally separate Web OAuth client, but is not necessary for BSDC.
          GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-$GOOGLE_CLIENT_FROM_FIREBASE}"
          cat > local.properties <<EOF
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_UPLOAD_PRESET=$CLOUDINARY_UPLOAD_PRESET
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests, Android lint, and debug APK build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test lint assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          exit "${PIPESTATUS[0]}"

      # The log artifact and redacted annotation make remote build failures diagnosable even when
      # GitHub's temporary runner-log endpoint is unavailable to a restricted integration token.
      - name: Surface Gradle failure summary
        if: ${{ failure() }}
        shell: bash
        run: |
          # Prefer diagnostic lines from the full log over the stack-trace-only tail.
          summary="$(grep -Ei -A3 -B2 '(^e:|error:|failure:|caused by:|exception:)' gradle-build.log | tail -n 100 | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-6000)"
          if [ -z "$summary" ]; then summary="$(tail -n 80 gradle-build.log | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-6000)"; fi
          echo "::error title=Gradle build failure::$summary"
      - name: Upload Gradle diagnostic log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: bsdc-gradle-diagnostic-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: gradle-build.log

      - name: Materialize release signing configuration
        id: signing
        if: ${{ steps.runtime_config.outputs.configured == 'true' && inputs.build_signed_release }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required signing secret: $name" >&2; exit 1; fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          cat >> local.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and AAB
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Generate artifact checksums
        if: ${{ steps.runtime_config.outputs.configured == 'true' }}
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > BSDC-ARTIFACTS-SHA256.txt
          cat BSDC-ARTIFACTS-SHA256.txt

      - name: Upload functional APK and optional signed AAB
        if: ${{ steps.runtime_config.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bsdc-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            BSDC-ARTIFACTS-SHA256.txt

  functions-typecheck:
    name: Type-check Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
