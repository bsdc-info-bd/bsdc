name: Android

# Builds, tests, lints, and signs the pure native Kotlin + Java + Jetpack Compose
# Android application (`bd.info.bsdc.app`) in `android-app/`.
#
#   Every push and pull request  -> JUnit tests, Android Lint, Debug APK artifact.
#   A tag like `android-v1.0.0`  -> Signed Release APK + Play Store AAB + R8 mapping.

on:
  push:
    branches: [main, 'arena/**']
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release APK + Play Store AAB as well as debug'
        type: boolean
        default: false

permissions:
  contents: write # needed only when publishing tagged releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Build native Android (Kotlin + Java + Compose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Provision Android SDK (API 35)
        env:
          CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        run: |
          set -o pipefail
          {
            sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
            echo "using $sdk"
            if [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$sdk/cmdline-tools"
              curl -sSfL -o /tmp/cmdline-tools.zip "$CMDLINE_TOOLS_URL"
              unzip -q /tmp/cmdline-tools.zip -d "$sdk/cmdline-tools"
              mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            fi
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            yes | "$manager" --licenses > /dev/null 2>&1 || true
            "$manager" --sdk_root="$sdk" \
              'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
            {
              echo "ANDROID_HOME=$sdk"
              echo "ANDROID_SDK_ROOT=$sdk"
            } >> "$GITHUB_ENV"
            echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          } > /tmp/sdk.out 2>&1 || status=$?
          status="${status:-0}"
          cat /tmp/sdk.out
          if [ "$status" -ne 0 ]; then
            echo "::error::Android SDK setup failed: $(tail -c 1200 /tmp/sdk.out | tr '\n' ' ')"
            exit "$status"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Verify native manifest & zero-Capacitor invariants
        working-directory: android-app
        run: |
          test ! -f capacitor.config.ts || { echo "::error::legacy capacitor config present"; exit 1; }
          manifest=app/src/main/AndroidManifest.xml
          grep -q 'android:host="www.bsdc.info.bd"' "$manifest" || { echo "::error::www.bsdc.info.bd link missing"; exit 1; }
          grep -q 'android:host="vf.main.bsdc.info.bd"' "$manifest" || { echo "::error::vf.main.bsdc.info.bd link missing"; exit 1; }
          grep -q 'android:host="vf.bsdc.info.bd"' "$manifest" || { echo "::error::vf.bsdc.info.bd link missing"; exit 1; }
          grep -q 'android:host="news.bsdc.info.bd"' "$manifest" || { echo "::error::news.bsdc.info.bd link missing"; exit 1; }
          grep -q 'android:autoVerify="true"' "$manifest" || { echo "::error::autoVerify missing"; exit 1; }
          grep -q 'android:scheme="bsdc"' "$manifest" || { echo "::error::bsdc scheme missing"; exit 1; }
          grep -q 'android:usesCleartextTraffic="false"' "$manifest" || { echo "::error::usesCleartextTraffic=false missing"; exit 1; }
          if grep -q 'usesCleartextTraffic="true"' "$manifest"; then echo "::error::cleartext traffic enabled"; exit 1; fi
          if grep -q 'ACCESS_BACKGROUND_LOCATION' "$manifest"; then echo "::error::background location declared"; exit 1; fi
          echo "Native manifest invariants verified."

      - name: Prepare debug Firebase configuration
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/prepare-firebase.mjs

      - name: Run all module unit tests, Android Lint & build debug APK
        working-directory: android-app
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_SUPABASE_URL: ${{ secrets.ANDROID_SUPABASE_URL }}
          ANDROID_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ANDROID_SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain \
            :core:model:test \
            :core:common:test \
            :core:permissions:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:auth:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug 2>&1 | tee /tmp/gradle.out || status=$?
          status="${status:-0}"
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E '(^e: |error:|FAILURE:|Execution failed for task)' /tmp/gradle.out | head -n 12 | tr '\n' ' ')
            if [ -z "$summary" ]; then
              summary=$(tail -c 1400 /tmp/gradle.out | tr '\n' ' ')
            fi
            echo "::error::Gradle debug build failed: $summary"
            exit "$status"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bsdc-native-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------- #
      # Signed Release APK + Play Store AAB
      # ---------------------------------------------------------------- #

      - name: Decode release signing keystore
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; release build cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/bsdc-release.keystore"
          echo "BSDC_KEYSTORE_PATH=$RUNNER_TEMP/bsdc-release.keystore" >> "$GITHUB_ENV"

      - name: Require production Firebase configuration for release
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/prepare-firebase.mjs --require-real-firebase

      - name: Build signed release APK & Play Store AAB
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        working-directory: android-app
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_SUPABASE_URL: ${{ secrets.ANDROID_SUPABASE_URL }}
          ANDROID_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ANDROID_SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
          BSDC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BSDC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BSDC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain \
            :core:model:test \
            :core:common:test \
            :core:permissions:testReleaseUnitTest \
            :core:network:testReleaseUnitTest \
            :core:auth:testReleaseUnitTest \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee /tmp/gradle-release.out || status=$?
          status="${status:-0}"
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E '(^e: |error:|FAILURE:|Execution failed for task)' /tmp/gradle-release.out | head -n 12 | tr '\n' ' ')
            if [ -z "$summary" ]; then
              summary=$(tail -c 1400 /tmp/gradle-release.out | tr '\n' ' ')
            fi
            echo "::error::Gradle release build failed: $summary"
            exit "$status"
          fi

      - name: Verify APK signature & print SHA-256 fingerprint
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        run: |
          apk=$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$apk"
          fingerprint=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          {
            echo '## Native Release Signed'
            echo
            echo "- Certificate SHA-256: \`$fingerprint\`"
            echo '- Confirm `ANDROID_CERT_FINGERPRINT` matches on `main-site` and `vf-site` for Android App Links.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts (APK, Play Store AAB, R8 mapping)
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: bsdc-native-release
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          body: |
            BSDC Native Android ${{ github.ref_name }} (`bd.info.bsdc.app`).
            - Signed universal/release APK for direct install
            - Signed AAB for Google Play Console
            - ProGuard/R8 `mapping.txt` for Play Console de-obfuscation
