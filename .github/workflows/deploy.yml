name: Deploy

# Ships the fourteen web applications to Cloudflare Pages and the bsdc-push
# Cloudflare Worker.
#
# One job per application, so a failure in the notice console never stops
# the member site from going out. Each job builds with that application's
# own environment variables and deploys the directory it produced; nothing
# is uploaded that was not built in the same job from the same commit.
#
# Pull requests get a preview deployment with its URL written into the run
# summary. Pushes to any branch (and non-preview manual dispatches) publish
# straight to production — including server-only Cloudflare Pages runtime
# secrets and `push-worker` (`bsdc-push`), so no merge to `main` is required.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: 'Deploy a single application (blank deploys all of them, or push-worker)'
        type: string
        default: ''
      target:
        description: 'Target environment (auto deploys production on pushes and manual runs; preview deploys previews)'
        type: choice
        options: [auto, production, preview]
        default: auto

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name != 'pull_request' && inputs.target != 'preview') && 'production' || 'preview' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { app: main-site, project: bsdc, firebase: main }
          - { app: admin-site, project: bsdc-admin, firebase: second }
          - { app: moderator-site, project: bsdc-mod, firebase: second }
          - { app: performance-site, project: bsdc-perf, firebase: second }
          - { app: config-site, project: bsdc-config, firebase: second }
          - { app: users-admin-site, project: bsdc-uadmin, firebase: second }
          - { app: users-moderator-site, project: bsdc-umod, firebase: second }
          - { app: customize-site, project: bsdc-custom, firebase: second }
          - { app: ip-site, project: bsdc-ip, firebase: second }
          - { app: status-site, project: bsdc-status, firebase: second }
          - { app: connect-site, project: bsdc-connect, firebase: second }
          - { app: certificate-site, project: bsdc-cert, firebase: second }
          - { app: vf-site, project: bsdc-vf, firebase: second }
          - { app: notice-site, project: bsdc-notice, firebase: second }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `jobs.<id>.if` cannot read the matrix context, so a single-app
      # deployment is filtered here instead: out-of-scope jobs start, skip
      # every step and finish in seconds.
      - name: Is this application in scope
        id: scope
        run: |
          if [ -z "${{ inputs.app }}" ] || [ "${{ inputs.app }}" = "${{ matrix.app }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }} was not requested; skipping."
          fi

      - name: Resolve deployment target
        id: target
        if: steps.scope.outputs.run == 'true'
        run: |
          IS_PROD="false"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ inputs.target }}" != "preview" ]; then
            IS_PROD="true"
          fi
          echo "is_prod=$IS_PROD" >> "$GITHUB_OUTPUT"
          if [ "$IS_PROD" = "true" ]; then
            echo "pages_branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "pages_branch=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      # The consoles compile the shared kit from source, so its own
      # dependencies have to resolve from its own directory.
      - name: Install the shared corporate kit
        if: steps.scope.outputs.run == 'true' && matrix.app != 'main-site'
        run: cd corporate-kit && npm install --no-audit --no-fund

      # A build that is missing a VITE_* value still compiles — Vite writes
      # `undefined` in and the failure only surfaces in the visitor's browser.
      # The check runs first and stops the deploy, naming every missing value,
      # so a forgotten secret is a red build here and never a broken site.
      - name: Build the member site
        if: steps.scope.outputs.run == 'true' && matrix.app == 'main-site'
        working-directory: main-site
        env:
          # Everything the browser needs must be compiled in here: the site is
          # built in this job and uploaded as static files, so a value that is
          # only set inside Cloudflare (or only in a developer's .env) never
          # reaches the bundle. All images are hosted exclusively by the edge;
          # server-only credentials are NEVER compiled into this bundle.
          BSDC_REQUIRED_ENV: >-
            VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,
            VITE_FB_API_KEY,VITE_FB_AUTH_DOMAIN,VITE_FB_PROJECT_ID,VITE_FB_APP_ID,VITE_FB_DATABASE_URL
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MSG_SENDER_ID: ${{ secrets.VITE_FB_MSG_SENDER_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
          VITE_FB_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          # Push and OneSignal are optional features: a missing value disables
          # them in the client, which is honest, so they are passed but not
          # required.
          VITE_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY || secrets.PUSH_VAPID_PUBLIC_KEY }}
          VITE_FIREBASE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_FIREBASE_VAPID_PUBLIC_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_SITE_URL: https://www.bsdc.info.bd
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/check-deploy-env.mjs"
          npm run build

      - name: Build the console
        if: steps.scope.outputs.run == 'true' && matrix.app != 'main-site'
        working-directory: ${{ matrix.app }}
        env:
          BSDC_REQUIRED_ENV: >-
            VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,
            VITE_FB2_API_KEY,VITE_FB2_AUTH_DOMAIN,VITE_FB2_PROJECT_ID,VITE_FB2_APP_ID,VITE_FB2_DATABASE_URL
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_FB2_API_KEY: ${{ secrets.VITE_FB2_API_KEY }}
          VITE_FB2_AUTH_DOMAIN: ${{ secrets.VITE_FB2_AUTH_DOMAIN }}
          VITE_FB2_PROJECT_ID: ${{ secrets.VITE_FB2_PROJECT_ID }}
          VITE_FB2_APP_ID: ${{ secrets.VITE_FB2_APP_ID }}
          VITE_FB2_DATABASE_URL: ${{ secrets.VITE_FB2_DATABASE_URL }}
          VITE_SITE_URL: https://www.bsdc.info.bd
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/check-deploy-env.mjs"
          npm run build

      # A build that produced nothing must not be published over a working
      # deployment. This is the last gate before the upload.
      - name: Check the build produced something
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ matrix.app }}
        run: |
          test -f dist/index.html || { echo "::error::${{ matrix.app }} produced no index.html"; exit 1; }
          test -d dist/assets || { echo "::error::${{ matrix.app }} produced no assets"; exit 1; }
          echo "${{ matrix.app }}: $(du -sh dist | cut -f1) in $(find dist -type f | wc -l) files"

      # A first publish has no project to publish into. Creating one is
      # idempotent in effect: the second run fails because the project is
      # already there, which is why the failure is ignored rather than
      # treated as a deployment problem.
      - name: Make sure the Pages project exists
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages project create ${{ matrix.project }}
            --production-branch=main

      # Database and Pages are separate workflows and can race on production
      # pushes. Wait for the exact ordered ledger and required grants before
      # publishing (never migrate here).
      - name: Install Postgres client for the member-site rollout gate
        if: steps.scope.outputs.run == 'true' && matrix.app == 'main-site' && steps.target.outputs.is_prod == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for the messenger database migration
        if: steps.scope.outputs.run == 'true' && matrix.app == 'main-site' && steps.target.outputs.is_prod == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/wait-for-messenger-migration.mjs

      # Firebase service accounts, ImgBB upload key, and runtime bindings are
      # server-only Pages secrets — never compiled into the Vite bundle and
      # never synced from pull requests.
      - name: Prepare Firebase authentication bindings
        if: steps.scope.outputs.run == 'true' && matrix.app == 'main-site' && steps.target.outputs.is_prod == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_BSDC_BD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
          FIREBASE_SERVICE_ACCOUNT_BSDC_SECOND: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_SECOND }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB2_PROJECT_ID: ${{ secrets.VITE_FB2_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          BSDC_IMGBB_API_KEY: ${{ secrets.BSDC_IMGBB_API_KEY }}
          PUSH_FLUSH_SECRET: ${{ secrets.PUSH_FLUSH_SECRET }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL || 'https://push.api.bsdc.info.bd' }}
          PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PUSH_VAPID_PUBLIC_KEY }}
          VITE_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_SUBJECT: ${{ secrets.PUSH_VAPID_SUBJECT }}
        run: |
          node scripts/prepare-firebase-bindings.mjs "$RUNNER_TEMP/bsdc-auth-bindings.json"
          node scripts/sync-push-secrets.mjs --target pages --bindings "$RUNNER_TEMP/bsdc-auth-bindings.json"

      - name: Configure production profile authentication
        if: steps.scope.outputs.run == 'true' && matrix.app == 'main-site' && steps.target.outputs.is_prod == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          command: pages secret bulk ${{ runner.temp }}/bsdc-auth-bindings.json --project-name=bsdc

      - name: Remove temporary authentication bindings
        if: always() && matrix.app == 'main-site'
        run: rm -f "$RUNNER_TEMP/bsdc-auth-bindings.json"

      # IMPORTANT: Cloudflare discovers Pages Functions relative to Wrangler's
      # working directory. Deploying `main-site/dist` from the monorepo root
      # omitted `main-site/functions`, leaving /api/auth/claims unavailable.
      #
      # Running from each package root uploads main-site/functions alongside
      # main-site/dist. Production pushes from any branch deploy with
      # --branch=main so live production reflects that branch without merging.
      - name: Deploy to Cloudflare Pages
        if: steps.scope.outputs.run == 'true'
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.app }}
          command: >-
            pages deploy dist
            --project-name=${{ matrix.project }}
            --branch=${{ steps.target.outputs.pages_branch }}
            --commit-dirty=true

      - name: Verify production member and corporate claim bindings
        if: steps.scope.outputs.run == 'true' && matrix.app == 'main-site' && steps.target.outputs.is_prod == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            "$DEPLOYMENT_URL/api/auth/claims" | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const status = JSON.parse(data);
                if (status.ready !== true) {
                  console.error("::error::Member Firebase claims credentials are missing in Pages.");
                  process.exit(1);
                }
                if (status.corporateReady !== true) {
                  console.error("::error::Corporate Firebase claims credentials are missing in Pages. Configure FB2_PROJECT_ID, FB2_CLIENT_EMAIL and FB2_PRIVATE_KEY, or supply FIREBASE_SERVICE_ACCOUNT_BSDC_SECOND.");
                  process.exit(1);
                }
              });'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            "$DEPLOYMENT_URL/api/media/providers" | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const status = JSON.parse(data);
                if (status.imgbb !== true) {
                  console.warn("::warning title=ImgBB key missing in Pages::Set IMGBB_API_KEY in GitHub Secrets (environment: production) or Cloudflare Pages project bsdc so image uploads succeed.");
                } else {
                  console.log("Verified: /api/media/providers reports imgbb=true.");
                }
              });'

          # The upload endpoint must exist. A deployment whose Pages Functions
          # were not uploaded answers an anonymous POST with 404 or with the app
          # shell, and every member then sees "uploads are not available" while
          # the key sits correctly in Cloudflare. 401 + a JSON errorKey is the
          # only correct answer, and it is the only way to tell the two apart
          # from outside.
          UPLOAD_CODE=$(curl -sS -o /tmp/bsdc-upload-check.json -w "%{http_code}" \
            -X POST -H "content-type: application/json" --data '{}' \
            "$DEPLOYMENT_URL/api/media/upload" || echo "000")
          if [ "$UPLOAD_CODE" != "401" ]; then
            echo "::error title=Upload endpoint missing::POST $DEPLOYMENT_URL/api/media/upload answered HTTP $UPLOAD_CODE instead of 401. The Pages Functions were not deployed with this site; uploads cannot work."
            cat /tmp/bsdc-upload-check.json || true
            exit 1
          fi
          rm -f /tmp/bsdc-upload-check.json
          echo "Upload endpoint is deployed and refusing anonymous callers, as it should."

          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            "$DEPLOYMENT_URL/api/push/config" | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const cfg = JSON.parse(data);
                if (typeof cfg.enabled !== "boolean") {
                  console.error("::error::/api/push/config returned an unexpected payload.");
                  process.exit(1);
                }
                if (cfg.enabled !== true) {
                  console.warn("::warning title=Pages push VAPID key missing::/api/push/config returned enabled=false.");
                }
                console.log("Verified: /api/push/config responded cleanly (enabled=" + cfg.enabled + ").");
              });'
          WAKE_CODE=$(curl -sS -o /tmp/bsdc-wake-check.json -w "%{http_code}" \
            -X POST -H "content-type: application/json" --data '{}' \
            "$DEPLOYMENT_URL/api/push/wake" || echo "000")
          rm -f /tmp/bsdc-wake-check.json
          if [ "$WAKE_CODE" != "401" ]; then
            echo "::error title=Push wake endpoint check failed::POST $DEPLOYMENT_URL/api/push/wake answered HTTP $WAKE_CODE instead of 401."
            exit 1
          fi

      - name: Record where it went
        if: steps.scope.outputs.run == 'true'
        run: |
          {
            echo "### ${{ matrix.app }} → ${{ matrix.project }}"
            echo
            echo "- ${{ steps.pages.outputs.deployment-url || 'deployed' }}"
            echo "- target ${{ steps.target.outputs.is_prod == 'true' && 'production' || 'preview' }} (${{ steps.target.outputs.pages_branch }})"
            echo "- commit ${GITHUB_SHA::7} from branch ${{ github.head_ref || github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The push delivery worker.
  #
  # A Cloudflare Worker with a cron trigger, deployed by `wrangler deploy` rather
  # than by the Pages action above. It exists because Pages Functions have no
  # cron handler of their own, and because a push that carries its words has to
  # be encrypted per subscription before it leaves — which a request-triggered
  # function cannot do for a device whose browser is closed.
  #
  # Runs directly on pushes from any branch (no merge to `main` needed)
  # as well as non-preview manual dispatches.
  # ---------------------------------------------------------------------------
  push-worker:
    name: Push worker → bsdc-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && inputs.target != 'preview'
    environment:
      name: production
    defaults:
      run:
        working-directory: push-worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Did the worker change?
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ inputs.app }}" ] || [ "${{ inputs.app }}" = "push-worker" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Always keep bsdc-push synchronized when pushing from any working/feature branch.
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            if git diff --quiet "${{ github.event.before }}" HEAD -- ../push-worker ../.github/workflows/deploy.yml ../scripts/prepare-firebase-bindings.mjs ../scripts/sync-push-secrets.mjs; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "The push worker did not change in this push."
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1 && git diff --quiet HEAD~1 HEAD -- ../push-worker ../.github/workflows/deploy.yml ../scripts/prepare-firebase-bindings.mjs ../scripts/sync-push-secrets.mjs; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The push worker did not change in this push."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Postgres client for push settings sync
        if: steps.changed.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${SUPABASE_DB_URL:-}" ] && ! command -v psql >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client && break
              sleep 5
              sudo apt-get update --fix-missing || true
            done
          fi

      - name: Install
        if: steps.changed.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changed.outputs.run == 'true'
        run: npm run test

      - name: Prepare push-worker runtime secrets
        if: steps.changed.outputs.run == 'true'
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT_BSDC_BD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BSDC_BD }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_CLIENT_EMAIL: ${{ secrets.FB_CLIENT_EMAIL }}
          FB_PRIVATE_KEY: ${{ secrets.FB_PRIVATE_KEY }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PUSH_FLUSH_SECRET: ${{ secrets.PUSH_FLUSH_SECRET }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL || 'https://push.api.bsdc.info.bd' }}
          PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PUSH_VAPID_PUBLIC_KEY }}
          VITE_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_SUBJECT: ${{ secrets.PUSH_VAPID_SUBJECT }}
        run: |
          node scripts/prepare-firebase-bindings.mjs --push-worker "$RUNNER_TEMP/bsdc-push-bindings.json"
          node scripts/sync-push-secrets.mjs --target worker --bindings "$RUNNER_TEMP/bsdc-push-bindings.json"

      - name: Deploy
        id: deploy_step
        if: steps.changed.outputs.run == 'true'
        shell: bash
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_WORKERS_API_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          if [ -z "$TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Push worker skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured; main-site /api/push/flush remains active."
            echo "- push-worker → skipped (Cloudflare credentials not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o /tmp/cf-workers-check.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || echo "000")

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Push worker skipped (Workers permission missing)::The configured Cloudflare API token only has Cloudflare Pages access (HTTP $HTTP_CODE on Workers API). Add 'Account -> Workers Scripts -> Edit' to CLOUDFLARE_API_TOKEN (or set CLOUDFLARE_WORKERS_API_TOKEN) to deploy bsdc-push; main-site /api/push/flush continues handling push wake-ups."
            {
              echo "### push-worker → bsdc-push (skipped)"
              echo
              echo "- Cloudflare API token lacks \`Account -> Workers Scripts -> Edit\` (HTTP $HTTP_CODE)."
              echo "- \`main-site\` \`/api/push/flush\` remains active; grant Workers Scripts Edit to enable cron encryption worker."
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f /tmp/cf-workers-check.json
            exit 0
          fi
          rm -f /tmp/cf-workers-check.json

          set +e
          CLOUDFLARE_API_TOKEN="$TOKEN" ./node_modules/.bin/wrangler deploy --keep-vars > /tmp/wrangler-deploy.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/wrangler-deploy.log
          if [ "$STATUS" -eq 0 ]; then
            if [ -s "$RUNNER_TEMP/bsdc-push-bindings.json" ] && [ "$(cat "$RUNNER_TEMP/bsdc-push-bindings.json")" != "{}" ]; then
              CLOUDFLARE_API_TOKEN="$TOKEN" ./node_modules/.bin/wrangler secret bulk "$RUNNER_TEMP/bsdc-push-bindings.json"
              sleep 3
            fi
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "- push-worker → bsdc-push (cron every minute, branch ${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "wrangler deploy exited with $STATUS; falling back to direct Cloudflare Workers script upload API..."
          ./node_modules/.bin/wrangler deploy --dry-run --keep-vars --outfile /tmp/worker.bundle
          BOUNDARY=$(head -n 1 /tmp/worker.bundle | tr -d '\r\n' | sed 's/^--//')
          PUT_CODE=$(curl -sS -o /tmp/cf-worker-put.json -w "%{http_code}" \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/bsdc-push?excludeScript=true" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: multipart/form-data; boundary=$BOUNDARY" \
            --data-binary @/tmp/worker.bundle || echo "000")
          rm -f /tmp/worker.bundle

          if [ "$PUT_CODE" = "200" ]; then
            SCHED_CODE=$(curl -sS -o /tmp/cf-worker-sched.json -w "%{http_code}" \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/bsdc-push/schedules" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '[{"cron":"* * * * *"}]' || echo "000")
            rm -f /tmp/cf-worker-sched.json
            if [ -s "$RUNNER_TEMP/bsdc-push-bindings.json" ] && [ "$(cat "$RUNNER_TEMP/bsdc-push-bindings.json")" != "{}" ]; then
              CLOUDFLARE_API_TOKEN="$TOKEN" ./node_modules/.bin/wrangler secret bulk "$RUNNER_TEMP/bsdc-push-bindings.json"
              sleep 3
            fi
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "Uploaded bsdc-push via Workers Script API (HTTP $PUT_CODE, schedule HTTP $SCHED_CODE)."
            echo "- push-worker → bsdc-push (cron every minute, branch ${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$PUT_CODE" = "401" ] || [ "$PUT_CODE" = "403" ] || grep -qiE "No access to the specified resource|Authentication error" /tmp/cf-worker-put.json 2>/dev/null; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Push worker skipped (Workers Scripts Edit permission missing)::The configured Cloudflare API token lacks 'Account -> Workers Scripts -> Edit' write access (HTTP $PUT_CODE). Grant 'Account -> Workers Scripts -> Edit' to CLOUDFLARE_API_TOKEN (or set CLOUDFLARE_WORKERS_API_TOKEN) to deploy bsdc-push; main-site /api/push/run local fallback continues serving push wake-ups."
            {
              echo "### push-worker → bsdc-push (skipped)"
              echo
              echo "- Cloudflare API token lacks \`Account -> Workers Scripts -> Edit\` write permission (HTTP $PUT_CODE)."
              echo "- \`main-site\` \`/api/push/run\` local path remains active; grant Workers Scripts Edit to enable the 1-minute cron encryption worker."
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f /tmp/cf-worker-put.json
            exit 0
          fi

          PUT_BODY=$(tr '\n' ' ' < /tmp/cf-worker-put.json | head -c 500 | sed 's/%/%25/g; s/\r//g')
          rm -f /tmp/cf-worker-put.json
          echo "::error title=Push worker deploy failed::HTTP $PUT_CODE: $PUT_BODY"
          exit 1

      - name: Verify push-worker health
        if: steps.changed.outputs.run == 'true'
        env:
          DEPLOYED: ${{ steps.deploy_step.outputs.deployed }}
          PUSH_FLUSH_SECRET: ${{ secrets.PUSH_FLUSH_SECRET }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { setTimeout: wait } = require("node:timers/promises");

            (async () => {
              const baseUrl = (process.env.PUSH_WORKER_URL || "https://push.api.bsdc.info.bd").trim().replace(/\/+$/, "");
              const healthUrl = baseUrl + "/health";
              const deployed = process.env.DEPLOYED === "true";

              let bindings = {};
              try {
                const raw = fs.readFileSync(path.join(process.env.RUNNER_TEMP || "/tmp", "bsdc-push-bindings.json"), "utf8");
                bindings = JSON.parse(raw);
              } catch {}
              const flushSecret = (process.env.PUSH_FLUSH_SECRET || bindings.PUSH_FLUSH_SECRET || "").trim();

              let health = null;
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  const res = await fetch(healthUrl, { signal: AbortSignal.timeout(15000) });
                  if (res.ok) {
                    const candidate = await res.json();
                    health = candidate;
                    if (candidate.status === "ok" && candidate.secret === true && candidate.database === true && candidate.fcm === true) {
                      break;
                    }
                  }
                } catch {}
                if (attempt < 4) await wait(5000);
              }

              if (!health) {
                if (deployed) {
                  console.error("::error::Could not reach " + healthUrl + " after deploying bsdc-push.");
                  process.exit(1);
                }
                console.warn("::warning title=push-worker health probe unreachable::Could not verify " + healthUrl + " (deploy skipped due to token scopes; Pages fallback remains active).");
                return;
              }

              console.log("bsdc-push /health:", JSON.stringify(health));
              if (health.fcm !== true) console.warn("::warning title=bsdc-push FCM unconfigured::bsdc-push /health reports fcm=false; check FIREBASE_SERVICE_ACCOUNT_BSDC_BD.");
              if (health.vapid !== true) console.warn("::warning title=bsdc-push VAPID unconfigured::bsdc-push /health reports vapid=false; check PUSH_VAPID_* secrets.");
              if (health.status !== "ok" || health.secret !== true || health.database !== true || health.fcm !== true) {
                const msg = "bsdc-push /health failed required checks (status=" + health.status + ", secret=" + health.secret + ", database=" + health.database + ", fcm=" + health.fcm + ").";
                if (deployed) {
                  console.error("::error::" + msg);
                  process.exit(1);
                }
                console.warn("::warning title=bsdc-push unconfigured::" + msg);
              }

              if (flushSecret.length >= 32) {
                let runStatus = 0;
                let runSummary = "";
                for (let attempt = 1; attempt <= 3; attempt += 1) {
                  try {
                    const res = await fetch(baseUrl + "/run?limit=1", {
                      method: "POST",
                      headers: { authorization: "Bearer " + flushSecret },
                      signal: AbortSignal.timeout(20000),
                    });
                    runStatus = res.status;
                    runSummary = await res.text();
                    if (runStatus === 200) break;
                  } catch {}
                  if (attempt < 3) await wait(3000);
                }
                console.log("bsdc-push POST /run?limit=1 HTTP " + runStatus + ": " + runSummary);
                if (runStatus !== 200) {
                  const safeBody = String(runSummary || "").replace(/[\r\n]+/g, " ").trim().slice(0, 220);
                  const msg = "bsdc-push POST /run?limit=1 returned HTTP " + runStatus + (safeBody ? ": " + safeBody : ".");
                  if (deployed) {
                    console.error("::error::" + msg);
                    process.exit(1);
                  }
                  console.warn("::warning title=bsdc-push flush probe non-200::" + msg);
                }
              }
            })().catch((err) => {
              console.error("::error::" + (err && err.message ? err.message : "Health verification failed"));
              process.exit(1);
            });
          '

      - name: Remove temporary push-worker bindings
        if: always()
        run: rm -f "$RUNNER_TEMP/bsdc-push-bindings.json"
