<!doctype html>
<!-- bsdc:hand-written — the embedded verification answer (§13.3).
     Deliberately a separate document from the portal: no search, no batch, no
     history, no report receipt. One code in, one answer out, and nothing on
     the page that identifies anybody. That is what makes it safe to frame. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>BSDC document check</title>
    <meta
      name="description"
      content="Check one BSDC certificate, notice or staff card code. Answers from the registry; nothing about the holder beyond what the document prints."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 1rem">
        This check needs JavaScript. The full verification desk is at
        <a href="https://vf.main.bsdc.info.bd/">vf.main.bsdc.info.bd</a>.
      </p>
    </noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
