    <path d="M25 32l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34"
        font-weight="800" fill="#1B4332" letter-spacing="-1">BSDC</text>
  <text x="90" y="64" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
        font-weight="600" fill="#2D6A4F" letter-spacing="0.5">SOFTWARE DEVELOPMENT COMMUNITY</text>
</svg>
