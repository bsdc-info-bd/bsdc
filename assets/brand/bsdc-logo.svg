<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img"
     aria-label="BSDC - Bangladesh Software Development Community">
  <defs>
    <linearGradient id="bsdcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D6A4F"/>
      <stop offset="1" stop-color="#1B4332"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8)">
    <rect width="64" height="64" rx="16" fill="url(#bsdcGrad)"/>
    <path d="M32 12 16 20v14c0 11 7.5 17 16 19 8.5-2 16-8 16-19V20L32 12z"
