<?xml version="1.0" encoding="UTF-8"?>
<!--
  BSDC App Icon — assets/brand/bsdc-icon.svg
  Purpose: The official BSDC application mark (PWA icon, Android adaptive foreground,
           Play Store icon, favicon source, splash mark, PDF seal, avatar ring badge).
  Geometry: rounded-square tile, corner radius ~22.5% of the side (115/512).
  Colour  : diagonal gradient #0B984D -> #0FB479 -> #13B89B (top-left to lower-right).
  Mark    : a white chevron (code) beside a white document with a folded corner (deliverable).
  Rules   : never stretch, never re-colour, never add outlines, never rasterise the master.
  Owner   : RRC Development / BSDC Platform Team
  Licence : Source-available. Re-deployment or rebranding is not permitted.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="BSDC application icon">
  <defs>
    <linearGradient id="bsdcIconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B984D"/>
      <stop offset="0.5" stop-color="#0FB479"/>
      <stop offset="1" stop-color="#13B89B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bsdcIconGradient)"/>
  <path d="M214 168 L152 256 L214 344" fill="none" stroke="#FFFFFF" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252 150 H360 L388 178 V348 A14 14 0 0 1 374 362 H252 A14 14 0 0 1 238 348 V164 A14 14 0 0 1 252 150 Z"
        fill="#FFFFFF"/>
  <path d="M360 150 V178 H388 Z" fill="#A8DBC1"/>
</svg>
