# gitleaks configuration
#
# The default rule set, plus the three places in this repository where the
# *shape* of a credential is written down on purpose:
#
#   - `main-site/functions/api/auth/claims.ts` parses a PEM private key, so
#     it contains the literal header and footer lines of one;
#   - `main-site/functions/api/auth/claims-core.ts` assembles service-account
#     credentials *from environment variables* — the generic-api-key rule
#     reads the env-var names FB_PRIVATE_KEY / FB2_PRIVATE_KEY on the
#     referencing line as if they were literal keys. The file holds no key
#     material and must never be given any;
#   - `docs/deploying.md` tells an operator what each secret has to look
#     like, including that a service-account key begins with that header.
#
# None holds key material. Everything else is scanned normally, and the
# scan runs over the whole history rather than the working tree.

[extend]
useDefault = true

[allowlist]
description = "PEM headers parsed or documented, and env-var names read as keys — never key material"
paths = [
  '''main-site/functions/api/auth/claims\\.ts''',
  '''main-site/functions/api/auth/claims-core\\.ts''',
  '''docs/deploying\\.md''',
]
