# gitleaks configuration
#
# The default rule set, plus the places in this repository where the *shape* of a
# credential is written down on purpose.
#
# A note on the `paths` table below: it names a *file*, not a finding. Only t31
# was listed when the first push fixture was written, and the later harnesses
# (t45, t46, t47) each seed the same sentinel setting because each one runs
# `bsdc.push_secret_matches` against a database of its own. The scan therefore
# failed on every one of them, and the failure said "gitleaks" and nothing an
# operator could act on. The entries now cover the range of harness numbers, so a
# new proof cannot reintroduce the finding — and so that the next person does not
# have to discover this by reading a red X.
#
# The allowlisted paths, and why each holds no production key material:
#
#   claims.ts               parses a PEM private key, so it contains the literal
#                           header and footer lines of one.
#   claims-core.ts          assembles service-account credentials *from
#                           environment variables*; the generic-api-key rule reads
#                           the env-var names FB_PRIVATE_KEY / FB2_PRIVATE_KEY on
#                           the referencing line as if they were literal keys.
#   deploying.md            tells an operator what each secret has to look like,
#                           including that a service-account key begins with that
#                           header.
#   support.test.ts         a synthetic public VAPID value for a parser test.
#   db-prove/*.mjs          a local-only sentinel flush secret in in-process
#                           PGlite proofs, never used for a real delivery. The same
#                           literal appears in t31, t45, t46 and t47 because each
#                           harness seeds the setting the routine compares against,
#                           and `run.mjs` runs them as one suite.
#
# Everything else is scanned normally, over the whole history rather than the
# working tree.

[extend]
useDefault = true

[allowlist]
description = "PEM headers and env-var names documented in code, plus synthetic push-test fixtures; never production key material"
paths = [
  '''main-site/functions/api/auth/claims\.ts$''',
  '''main-site/functions/api/auth/claims-core\.ts$''',
  '''docs/deploying\.md$''',
  '''main-site/src/lib/push/support\.test\.ts$''',
  '''main-site/scripts/db-prove/t3[0-9]\.mjs$''',
  '''main-site/scripts/db-prove/t4[0-9]\.mjs$''',
]

# This exact public alphabet appeared as one literal in the historical
# advertiser-issuing script; it is not a credential. Ignore only that value,
# not the script or its rule, since the scan includes the whole Git history.
regexes = [
  '''^abcdefghjkmnpqrstuvwxyzACDEFGHJKLMNPQRSTUVWXYZ23456789$''',
]
